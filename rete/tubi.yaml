# Parametri meccanici dei tubi di rete/griglia_3x3.inp.
# L'.inp resta EPANET standard: qui c'è solo ciò che EPANET non conosce.
# Ogni tubo prende i valori di `default`; `tubi` contiene solo gli override.
# Controllo di coerenza: diametro_esterno_mm - 2*spessore_mm (- 2*spessore
# della guaina, che sta all'interno) deve coincidere con il diametro dell'.inp.

default:
  materiale: PE100
  diametro_esterno_mm: 110
  spessore_mm: 10
  E_GPa: 1.0          # modulo elastico
  nu: 0.40            # coefficiente di Poisson
  profondita_m: 1.0   # interramento (serve per la temperatura, passo 5)

tubi:
  P0:  {materiale: ghisa, diametro_esterno_mm: 160, spessore_mm: 8, E_GPa: 170, nu: 0.26}
  P12: {guaina: {spessore_mm: 6, E_GPa: 8}}   # tubo risanato con relining
