# Mechanical parameters of the pipes in network/street_*.inp and network/single_pipe_*.inp (all PE100 SDR11 DN110: only the default).
# Dimensions: Uponor / Aliaxis PE100 datasheets (EN 12201-2), see docs/fonti.md.

default:
  material: PE100
  outer_diameter_mm: 110
  wall_thickness_mm: 10
  E_GPa: 1.0          # elastic modulus
  nu: 0.40            # Poisson's ratio
  depth_m: 1.0        # burial depth (used for temperature, step 5)

pipes: {}
