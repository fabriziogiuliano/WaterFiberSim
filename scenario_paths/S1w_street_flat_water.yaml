# Scenario S1w - as S1, plus the WATER temperature: water leaves the reservoir 2 °C warmer than the soil (step T2, water). S1 - flat street: pressure drops only because of head loss.
# Same fibre in S1 and S2 (interrogator at the start of the street, N0): only the water changes,
# so the figures can be compared directly (z is about the distance along the street).
title: "S1w. Strada piana, acqua più calda del terreno"
description: "Strada di 1 km in piano, serbatoio a monte (N0).\nUn rubinetto ogni 100 m. La pressione cala\nsolo per la perdita di carico."
network: network/street_flat.inp
pipes: network/street_pipes.yaml

temperature:                 # soil constant and equal to the baseline: only the water changes the temperature
  baseline_c: 12             # soil when the baseline (0 bar) was measured
  soil_c: 12                 # soil now (unchanged)
  drift_c_per_day: 0
  helix_mhz_per_c: 6         # helix thermal sensitivity: range 3.5-8 MHz/°C, TO CALIBRATE
  water:                     # [BL24] Blokker et al. 2024, Eq. 1-3
    source_c: 14             # water leaving the reservoir: +2 °C on the soil (CHOSEN; [BL24]: 0.6-1.6 measured, 1-5 K in sensitivity)
    soil_k_w_mk: 1.6         # dry sand                                                   [BL24]
    pipe_k_w_mk: 0.38        # PE100, DIN EN 12667                                        Oadby Plastics datasheet
    tsoi: 1                  # thermal sphere of influence (CHOSEN; [BL24]: one to two pipe radii)

fibers:
  - id: S1w
    interrogator:                # loop: both fiber ends on the instrument (ports A and B)
      node: N0
      technique: BOTDA
      channel: 1
      pulse_width_ns: 20         # pump pulse duration -> spatial resolution c*tau/(2n) ~ 2 m       [B23]
      adc_sample_rate_msps: 125  # ADC sampling rate   -> sampling interval c/(2n f_s) ~ 0.8 m     [B23]
      freq_step_mhz: 1           # frequency scan step (delta)                                     [B23] Tab. 1, phase II
      n_averages: 256            # traces averaged per frequency step (N_AV)                       [B23] Tab. 1
      scan_window_ghz: [10.75, 11.3]  # must contain every peak (rest profile + pressure + temperature)  [B23] Tab. 1, phase II
      linewidth_mhz: 58          # Brillouin gain FWHM with a 2 m resolution                       [ST13] §3
      snr0_db: 0                 # SNR at the fibre input, one trace, at snr0_resolution_m ("realistic")  [ST13] §3
      snr0_resolution_m: 2
    group_index: 1.468         # fibre group index (v = c/n), standard single-mode at 1550 nm: TO VERIFY on a datasheet
    attenuation_db_per_km: 0.2 # fibre loss at 1550 nm (measured 0.211-0.22 dB/km)                       [ST13] §2-3
    calc_step_m: 0.1           # simulator calculation step along the fibre (NOT the instrument sampling)
    sensing_leg:   {layout: helix, angle_deg: 70, bonding: bonded}
    reference_leg: {layout: straight, bonding: loose_tube}
    route:                     # ordered from port A; the reference leg retraces it backwards to port B
      - {lead: 10, to: N0}     # cable from the cabinet to the pipe
      - {pipe: P1, from: N0}
      - {pipe: P2, from: N1}
      - {pipe: P3, from: N2}
      - {pipe: P4, from: N3}
      - {pipe: P5, from: N4}
      - {pipe: P6, from: N5}
      - {pipe: P7, from: N6}
      - {pipe: P8, from: N7}
      - {pipe: P9, from: N8}
      - {pipe: P10, from: N9}
    junction_m: 2              # splice at the far end (N10): sensing leg -> reference leg
