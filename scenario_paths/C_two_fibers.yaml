# Scenario C - two fibers on two channels of the same interrogator: all 12 grid pipes (P0, cast iron, only as lead).
# Fiber 1: the perimeter. Fiber 2: the inner cross, reached with lead cables (450 m not on pipes).
title: "C. Due fibre"
description: "Fibra 1: il perimetro. Fibra 2: la croce interna.\nTutta la griglia; servono 2 canali\ndello stesso interrogatore e più cavo."
network: network/grid_3x3.inp
pipes: network/pipes.yaml

fibers:
  - id: C1
    interrogator:                # loop: both fiber ends on the instrument (ports A and B)
      node: R1
      technique: BOTDA
      channel: 1
      pulse_width_ns: 20         # pump pulse duration -> spatial resolution c*tau/(2n) ~ 2 m       [B23]
      adc_sample_rate_msps: 125  # ADC sampling rate   -> sampling interval c/(2n f_s) ~ 0.8 m     [B23]
      freq_step_mhz: 1           # frequency scan step (delta)                                     [B23] Tab. 1, phase II
      n_averages: 256            # traces averaged per frequency step (N_AV)                       [B23] Tab. 1
      scan_window_ghz: [10.75, 11.3]  # must contain every peak (rest profile + pressure + temperature)  [B23] Tab. 1, phase II
      linewidth_mhz: 58          # Brillouin gain FWHM with a 2 m resolution                       [ST13] §3
      snr0_db: 0                 # SNR at the fibre input, one trace, at snr0_resolution_m ("realistic")  [ST13] §3
      snr0_resolution_m: 2
    group_index: 1.468         # fibre group index (v = c/n), standard single-mode at 1550 nm: TO VERIFY on a datasheet
    attenuation_db_per_km: 0.2 # fibre loss at 1550 nm (measured 0.211-0.22 dB/km)                       [ST13] §2-3
    calc_step_m: 0.1           # simulator calculation step along the fibre (NOT the instrument sampling)
    sensing_leg:   {layout: helix, angle_deg: 70, bonding: bonded}
    reference_leg: {layout: straight, bonding: loose_tube}
    route:
      - {lead: 215, to: J11}    # lead-in cable along P0: no helix on the cast-iron main (it would sense almost nothing)
      - {pipe: P1,  from: J11}
      - {pipe: P2,  from: J12}
      - {pipe: P7,  from: J13}
      - {pipe: P8,  from: J23}
      - {pipe: P6,  from: J33}
      - {pipe: P5,  from: J32}
      - {pipe: P12, from: J31}
      - {pipe: P11, from: J21}
    junction_m: 2

  - id: C2
    interrogator:                # loop: both fiber ends on the instrument (ports A and B)
      node: R1
      technique: BOTDA
      channel: 2
      pulse_width_ns: 20         # pump pulse duration -> spatial resolution c*tau/(2n) ~ 2 m       [B23]
      adc_sample_rate_msps: 125  # ADC sampling rate   -> sampling interval c/(2n f_s) ~ 0.8 m     [B23]
      freq_step_mhz: 1           # frequency scan step (delta)                                     [B23] Tab. 1, phase II
      n_averages: 256            # traces averaged per frequency step (N_AV)                       [B23] Tab. 1
      scan_window_ghz: [10.75, 11.3]  # must contain every peak (rest profile + pressure + temperature)  [B23] Tab. 1, phase II
      linewidth_mhz: 58          # Brillouin gain FWHM with a 2 m resolution                       [ST13] §3
      snr0_db: 0                 # SNR at the fibre input, one trace, at snr0_resolution_m ("realistic")  [ST13] §3
      snr0_resolution_m: 2
    group_index: 1.468         # fibre group index (v = c/n), standard single-mode at 1550 nm: TO VERIFY on a datasheet
    attenuation_db_per_km: 0.2 # fibre loss at 1550 nm (measured 0.211-0.22 dB/km)                       [ST13] §2-3
    calc_step_m: 0.1           # simulator calculation step along the fibre (NOT the instrument sampling)
    sensing_leg:   {layout: helix, angle_deg: 70, bonding: bonded}
    reference_leg: {layout: straight, bonding: loose_tube}
    route:
      - {lead: 300, to: J21}            # from the interrogator to J21, alongside P0 and P11
      - {pipe: P3,  from: J21}
      - {pipe: P4,  from: J22}
      - {lead: 150, from: J23, to: J12} # jump across the block, not on a pipe
      - {pipe: P9,  from: J12}
      - {pipe: P10, from: J22}
    junction_m: 2
